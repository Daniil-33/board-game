services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_DB: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - game-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U game -d game]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?required}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://game:${POSTGRES_PASSWORD:?required}@db:5432/game
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?required}
    networks:
      internal:
      edge:
        aliases: ["${DEPLOY_ENV:?required}-server"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
    restart: unless-stopped
    cpus: 1
    mem_limit: 768m
  web:
    build:
      context: ../..
      dockerfile: apps/client/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?required}
    environment:
      API_ORIGIN: ${API_ORIGIN:?required}
    networks:
      edge:
        aliases: ["${DEPLOY_ENV:?required}-web"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
volumes:
  game-data:
networks:
  internal:
    internal: true
  edge:
    external: true
    name: edge-${DEPLOY_ENV:?required}
