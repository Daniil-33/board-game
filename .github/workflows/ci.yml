name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Database of the server integration tests (`pnpm test:integration`).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from package.json "packageManager" (pnpm@9.15.9).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store keyed on pnpm-lock.yaml.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client boundaries and localization lint
        run: pnpm --filter @game/client lint

      - name: Typecheck
        run: pnpm build

      - name: Client bundle and browser typecheck
        run: |
          pnpm --filter @game/client build:bundle
          pnpm typecheck:e2e

      - name: Strict OpenSpec validation
        run: pnpm dlx @fission-ai/openspec@2.0.0 validate --all --strict

      - name: Deployment scripts and isolated edge checks
        run: |
          python3 -m unittest discover -s deploy/tests -v
          shellcheck deploy/edge/*.sh deploy/deploy.sh deploy/tests/check-edge.sh
          python3 deploy/tests/check-compose.py
          sh deploy/tests/check-edge.sh

      - name: Test
        run: pnpm test

      - name: Integration test (Postgres)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://game:game@127.0.0.1:5432/postgres

  compose-browser:
    name: compose-browser
    # Playwright 1.58.2 supports Ubuntu24.04; ubuntu-latest has moved to26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Ephemeral CI database only. The production file requires an operator password.
      POSTGRES_PASSWORD: ephemeral-ci-database
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start production stack
        run: docker compose -p s1-e2e up --build -d --wait
      - name: Extract manifest from the served web image
        run: ./scripts/extract-client-manifest.sh "$(docker compose -p s1-e2e ps -q web)"
      - name: Production browser scenarios
        run: pnpm test:e2e --output=test-results/production
        env:
          E2E_RESTART_COMMAND: docker compose -p s1-e2e restart server
          E2E_WEB_LOGS_COMMAND: docker compose -p s1-e2e logs --no-color web
      - name: Preserve production report
        if: always()
        run: |
          mkdir -p evidence
          test ! -f playwright-report/results.json || cp playwright-report/results.json evidence/production-results.json
      - name: Collect Compose logs and configuration evidence
        if: always()
        run: |
          mkdir -p evidence
          docker compose -p s1-e2e logs --no-color > evidence/production-compose.log 2>&1
          docker compose -p s1-e2e ps -a > evidence/production-services.txt
      - name: Sanitize artifacts
        id: sanitize
        if: always()
        run: python3 scripts/sanitize-artifacts.py test-results playwright-report evidence
      - name: Upload browser evidence
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: compose-browser-evidence
          path: |
            test-results/
            playwright-report/
            evidence/
          retention-days: 14
      - name: Stop isolated stack
        if: always()
        run: |
          docker compose -p s1-e2e down -v

  compose-browser-fixtures:
    name: compose-browser-fixtures
    # Playwright 1.58.2 supports Ubuntu24.04; ubuntu-latest has moved to26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Ephemeral CI database only. The production file requires an operator password.
      POSTGRES_PASSWORD: ephemeral-ci-database
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated fixture stack (real dice)
        run: docker compose -p s4-fixtures -f docker-compose.yml -f docker-compose.fixtures.yml up --build -d --wait
        env:
          WEB_PORT: '8082'
      - name: Stage 4 and 5 three-client fixture scenarios
        id: fixtures
        run: pnpm test:e2e e2e/stage4.spec.ts e2e/stage5.spec.ts --output=test-results/fixtures
        env:
          E2E_FIXTURES: '1'
          E2E_BASE_URL: http://127.0.0.1:8082
          E2E_FIXTURE_RESTART_COMMAND: docker compose -p s4-fixtures -f docker-compose.yml -f docker-compose.fixtures.yml restart server
          # Read-only SELECT of the game_results row (stage 5 winner scenario).
          E2E_FIXTURE_SQL_COMMAND: docker compose -p s4-fixtures -f docker-compose.yml -f docker-compose.fixtures.yml exec -T -e PGOPTIONS=-cdefault_transaction_read_only=on db psql -U game -d game -At
          WEB_PORT: '8082'
      - name: Preserve fixture report and logs
        if: always()
        run: |
          mkdir -p evidence
          if [ '${{ steps.fixtures.outcome }}' != 'skipped' ]; then
            test ! -f playwright-report/results.json || cp playwright-report/results.json evidence/fixture-results.json
          fi
          WEB_PORT=8082 docker compose -p s4-fixtures -f docker-compose.yml -f docker-compose.fixtures.yml logs --no-color > evidence/fixture-compose.log 2>&1
      - name: Sanitize artifacts
        id: sanitize
        if: always()
        run: python3 scripts/sanitize-artifacts.py test-results playwright-report evidence
      - name: Upload browser evidence
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: compose-browser-fixtures-evidence
          path: |
            test-results/
            playwright-report/
            evidence/
          retention-days: 14
      - name: Stop isolated stack
        if: always()
        run: |
          WEB_PORT=8082 docker compose -p s4-fixtures -f docker-compose.yml -f docker-compose.fixtures.yml down -v

  compose-browser-seeded:
    name: compose-browser-seeded
    # Playwright 1.58.2 supports Ubuntu24.04; ubuntu-latest has moved to26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Ephemeral CI database only. The production file requires an operator password.
      POSTGRES_PASSWORD: ephemeral-ci-database
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Fresh deterministic stack
        run: docker compose -p s1-seeded -f docker-compose.yml -f docker-compose.e2e.yml up --build -d --wait
        env:
          WEB_PORT: '8081'
      - name: Extract manifest from the served web image
        run: WEB_PORT=8081 ./scripts/extract-client-manifest.sh "$(WEB_PORT=8081 docker compose -p s1-seeded -f docker-compose.yml -f docker-compose.e2e.yml ps -q web)"
      - name: Seeded browser scenario
        run: pnpm test:e2e --output=test-results/seeded
        env:
          E2E_DETERMINISTIC: '1'
          E2E_BASE_URL: http://127.0.0.1:8081
      - name: Collect Compose logs and configuration evidence
        if: always()
        run: |
          mkdir -p evidence
          WEB_PORT=8081 docker compose -p s1-seeded -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > evidence/seeded-compose.log 2>&1
      - name: Sanitize artifacts
        id: sanitize
        if: always()
        run: python3 scripts/sanitize-artifacts.py test-results playwright-report evidence
      - name: Upload browser evidence
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: compose-browser-seeded-evidence
          path: |
            test-results/
            playwright-report/
            evidence/
          retention-days: 14
      - name: Stop isolated stacks
        if: always()
        run: |
          WEB_PORT=8081 docker compose -p s1-seeded -f docker-compose.yml -f docker-compose.e2e.yml down -v
