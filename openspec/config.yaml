schema: spec-driven

context: |
  Economic board game — Monopoly-inspired, built in TypeScript/Node.js.
  Game rules live in GAME-BREAKDOWN.md at the repo root — this is the canonical product spec.

  Architecture constraints (non-negotiable):
  - Headless deterministic core: no imports from UI, server, DB, network, timers, or global random.
    Trusted time and randomness are passed explicitly via TransitionContext.
  - Pure functions for transitions: same (state, command, context) → same result, always.
  - Monetary arithmetic uses integer quanta of 10 (Q(x) = 10 × floor(x/10)); no floating point for money.
  - Commands are idempotent: a rejected command never mutates state or consumes randomness.
  - Replay: given the same seed/config + ordered inputs → identical full state and events.

  Tech stack (accepted, see ROADMAP.md §"Технические решения"):
  - Runtime: Node.js, TypeScript strict mode; package manager: pnpm workspaces; testing: vitest
  - packages/game-core: pure rules engine, no UI framework, no I/O
  - packages/protocol: client/server message schemas shared by both sides
  - apps/server: Fastify + @fastify/websocket; PostgreSQL (command log and snapshots in jsonb,
    users/rooms/results relational) via Drizzle or Kysely; guest login (nickname + session token)
  - apps/client: Vite + TypeScript, Vue 3 for DOM UI, PixiJS for board rendering
  - Deployment: Docker Compose, single node; no Redis or horizontal scaling in MVP

  MVP scope (see ROADMAP.md and GAME-BREAKDOWN.md §"MVP: что входит и что отложено"):
  - A complete networked game: 2–6 guests in separate browsers play a full CLASSIC_40 game to a winner
  - Rules: the accepted profile in GAME-BREAKDOWN.md (movement, purchase, auction, three rent
    families, building, mortgage, auto-liquidation, bankruptcy, casino, chance subset, trades)
  - Infrastructure: authoritative room server, WebSocket protocol, persistence and recovery,
    reconnect, timeouts so AFK players cannot stall a room
  - Development order: ROADMAP.md stages; each stage delivers one mechanic through all layers

  Agents must not invent product rules. If a rule is marked "open" in GAME-BREAKDOWN.md it
  must be surfaced as an open question, not silently assumed.

rules:
  proposal:
    - State explicitly what is out of scope for this change
    - Reference the relevant GAME-BREAKDOWN.md sections by heading
  tasks:
    - Each task must be independently verifiable
    - Implementation tasks must reference the spec section they implement
    - No task should require more than one new package or module

operations:
  apply:
    guidance:
      - Run tsc --noEmit after each package change to catch type errors early
      - Write vitest tests alongside implementation, not after
      - Never introduce floating point for monetary values
