services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_DB: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - game-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U game -d game]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://game:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/game
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      LOGO_SET: ${LOGO_SET-brand}
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80
    depends_on:
      server:
        condition: service_healthy
volumes:
  game-data:
