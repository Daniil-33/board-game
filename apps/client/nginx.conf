# Request paths only: invite queries and Referer can contain access credentials.
log_format game '$remote_addr - $remote_user [$time_local] '
                '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  access_log /var/log/nginx/access.log game;
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /config.js { add_header Cache-Control "no-cache" always; }
  location = /version.txt { add_header Cache-Control "no-cache" always; }
  location ^~ /.vite/ { return 404; }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://server:8787;
    proxy_set_header Host $host;
  }
  location /ws {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    send_timeout 1h;
  }
}
